- name: Creating EC2 instances and route53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: devopspractice.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
    - name: Create Ec2 instances
      amazon.aws.ec2_instance:
       name: "roboshop-{{ item }}"
       instance_type: t3.micro
       state: present
       image_id: "{{ ami_id }}"
       region: us-east-1
       security_groups:
        - roboshop-common
        - "roboshop-{{ item }}"
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    - name: Creating route53 records
      amazon.aws.route53:
        state: present
        type: A
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"

    - name: Deleting the route53 records
      amazon.aws.route53:
        state: absent
        type: A
        zone: "{{ domain_name }}"
        record: "{{ item }}.{{ domain_name }}"
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
      loop: "{{ instances }}"
      when: action == "delete"

    - name: Deleting Ec2 instances
      amazon.aws.ec2_instance:
       name: "roboshop-{{ item }}"
       instance_type: t3.micro
       state: absent
       image_id: "{{ ami_id }}"
       region: us-east-1
       wait: false
      loop: "{{ instances }}"
      when: action == "delete"