- name: configure cart server
  hosts: cart
  become: yes
  tasks:
    - name: disable nodejs
      command: dnf module disable nodejs -y

    - name: Enable nodejs:24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      package:
       name: nodejs
       state: present 
 
    - name: Verify nodejs version
      command: node -v
      register: nodejs_version

    - name: print the version
      debug: 
       msg: "{{ nodejs_version }}"

    - name: Create sysytem cart
      user: 
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system cart"

    - name: removing the existing app directory
      file:
        path: /app
        state: absent

    - name: removing cart.zip
      file:
        path: /tmp/cart.zip
        state: absent

    - name: removing the existing app directory
      file:
        path: /app
        state: directory   

    - name: download the application
      get_url:
        url: https://raw.githubcartcontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-v4.zip
        dest: /tmp/cart.zip

    - name: Unzipping the file
      ansible.builtin.unarchive:
       src: /tmp/cart.zip
       dest: /app
       remote_src: yes

    - name: Installing the dependencies
      community.general.npm:
       path: /app

    - name: copy cart service
      template:
        src: cart.servce.j2
        dest: /etc/systemd/system/cart.service

    - name: daemon reload
      systemd_service:
       daemon_reload: true

    - name: start and enable cart
      service:
       name: cart
       state: restarted
       enabled: yes
