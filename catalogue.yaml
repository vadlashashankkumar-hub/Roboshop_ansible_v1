- name: configure catalogue server
  hosts: catalogue
  become: yes
  tasks:
    - name: disable nodejs
      command: dnf module disable nodejs -y

    - name: Enable nodejs:24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      package:
       name: nodejs
       state: present 
 
    - name: Verify nodejs version
      command: node -v
      register: nodejs_version

    - name: print the version
      debug: 
       msg: "{{ nodejs_version }}"